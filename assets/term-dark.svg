<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="758" viewBox="0 0 1150 758" role="img" aria-label="A terminal session. $ whoami — Nima Naghibi, backend and infrastructure engineer at Hatchup. $ cat about.txt — I build the layer underneath: APIs, the servers behind them, and the automation that puts them there. When I want to understand something, I write it from scratch. $ ls langs/ — bash, c, go, java, python, typescript. $ ls stack/ — ansible, docker, docker-swarm, grafana, kafka, linux, portainer, postgresql, prometheus, redis. $ cat .focus — distributed systems, networking, operating systems, system design, security. $ uptime — Iran, always curious.">
  <rect x="0.5" y="0.5" width="1149" height="757" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 48 H1150" stroke="#30363d"/>

  <circle cx="32" cy="24" r="7.5" fill="#ff5f57"/>
  <circle cx="58" cy="24" r="7.5" fill="#febc2e"/>
  <circle cx="84" cy="24" r="7.5" fill="#28c840"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="575" y="30" font-size="15" fill="#8b949e" text-anchor="middle">nima@github: ~</text>

    <text x="40" y="100"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9" dx="12">whoami</tspan></text>
    <text x="40" y="138" font-size="24" font-weight="600" fill="#e6edf3">Nima Naghibi</text>
    <text x="40" y="171" font-size="18" fill="#8b949e">Backend &amp; infrastructure engineer @ Hatchup</text>

    <text x="40" y="222"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9" dx="12">cat about.txt</tspan></text>
    <text x="40" y="255" fill="#8b949e">I build the layer underneath — APIs, the servers behind them, and the automation</text>
    <text x="40" y="288" fill="#8b949e">that puts them there. When I want to understand something, I write it from scratch.</text>

    <text x="40" y="339"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9" dx="12">ls langs/</tspan></text>
    <text y="372" fill="#58a6ff"><tspan x="40">bash/</tspan><tspan x="196">c/</tspan><tspan x="352">go/</tspan><tspan x="508">java/</tspan><tspan x="664">python/</tspan><tspan x="820">typescript/</tspan></text>

    <text x="40" y="423"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9" dx="12">ls stack/</tspan></text>
    <text y="456" fill="#58a6ff"><tspan x="40">ansible/</tspan><tspan x="220">docker/</tspan><tspan x="400">docker-swarm/</tspan><tspan x="580">grafana/</tspan><tspan x="760">kafka/</tspan></text>
    <text y="489" fill="#58a6ff"><tspan x="40">linux/</tspan><tspan x="220">portainer/</tspan><tspan x="400">postgresql/</tspan><tspan x="580">prometheus/</tspan><tspan x="760">redis/</tspan></text>

    <text x="40" y="540"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9" dx="12">cat .focus</tspan></text>
    <text x="40" y="573" fill="#8b949e">distributed systems · networking · operating systems · system design · security</text>

    <text x="40" y="624"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9" dx="12">uptime</tspan></text>
    <text x="40" y="657" fill="#8b949e">Iran · always curious</text>

    <text x="40" y="708" fill="#3fb950">$</text>
  </g>

  <rect x="64" y="693" width="12" height="21" fill="#3fb950">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
