<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="A terminal session. $ whoami — Nima Naghibi, backend and infrastructure engineer at Hatchup. $ cat about.txt — I build the layer underneath: APIs, the servers behind them, and the automation that puts them there. When I want to understand something, I write it from scratch. $ ls langs/ — bash, c, go, java, python, typescript. $ ls stack/ — ansible, docker, docker-swarm, grafana, kafka, linux, portainer, postgresql, prometheus, redis. $ cat .focus — distributed systems, networking, operating systems, system design, security. $ uptime — Iran, always curious.">
  <rect x="0.5" y="0.5" width="1199" height="679" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
  <path d="M0 44 H1200" stroke="#d1d9e0"/>

  <circle cx="28" cy="22" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="22" r="7" fill="#febc2e"/>
  <circle cx="76" cy="22" r="7" fill="#28c840"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="600" y="27.5" font-size="14" fill="#59636e" text-anchor="middle">nima@github: ~</text>

    <text x="36" y="88"><tspan fill="#1a7f37">$</tspan><tspan fill="#1f2328" dx="10">whoami</tspan></text>
    <text x="36" y="121" font-size="21" font-weight="600" fill="#1f2328">Nima Naghibi</text>
    <text x="36" y="149" font-size="16" fill="#59636e">Backend &amp; infrastructure engineer @ Hatchup</text>

    <text x="36" y="193"><tspan fill="#1a7f37">$</tspan><tspan fill="#1f2328" dx="10">cat about.txt</tspan></text>
    <text x="36" y="221" fill="#59636e">I build the layer underneath — APIs, the servers behind them, and the</text>
    <text x="36" y="249" fill="#59636e">automation that puts them there. When I want to understand something,</text>
    <text x="36" y="277" fill="#59636e">I write it from scratch.</text>

    <text x="36" y="321"><tspan fill="#1a7f37">$</tspan><tspan fill="#1f2328" dx="10">ls langs/</tspan></text>
    <text y="349" fill="#0969da"><tspan x="36">bash/</tspan><tspan x="176">c/</tspan><tspan x="316">go/</tspan><tspan x="456">java/</tspan><tspan x="596">python/</tspan><tspan x="736">typescript/</tspan></text>

    <text x="36" y="393"><tspan fill="#1a7f37">$</tspan><tspan fill="#1f2328" dx="10">ls stack/</tspan></text>
    <text y="421" fill="#0969da"><tspan x="36">ansible/</tspan><tspan x="196">docker/</tspan><tspan x="356">docker-swarm/</tspan><tspan x="516">grafana/</tspan><tspan x="676">kafka/</tspan></text>
    <text y="449" fill="#0969da"><tspan x="36">linux/</tspan><tspan x="196">portainer/</tspan><tspan x="356">postgresql/</tspan><tspan x="516">prometheus/</tspan><tspan x="676">redis/</tspan></text>

    <text x="36" y="493"><tspan fill="#1a7f37">$</tspan><tspan fill="#1f2328" dx="10">cat .focus</tspan></text>
    <text x="36" y="521" fill="#59636e">distributed systems · networking · operating systems · system design · security</text>

    <text x="36" y="565"><tspan fill="#1a7f37">$</tspan><tspan fill="#1f2328" dx="10">uptime</tspan></text>
    <text x="36" y="593" fill="#59636e">Iran · always curious</text>

    <text x="36" y="637" fill="#1a7f37">$</text>
  </g>

  <rect x="56" y="624" width="10" height="18" fill="#1a7f37">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
