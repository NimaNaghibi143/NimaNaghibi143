<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="908" viewBox="0 0 1150 908" role="img" aria-label="A zsh terminal session. whoami: Nima Naghibi, backend and infrastructure engineer at Hatchup. cat about.txt: I build the layer underneath - APIs, the servers behind them, and the automation that puts them there. When I want to understand something, I write it from scratch. ls langs/: bash, c, go, java, python, typescript. ls stack/: ansible, docker, docker-swarm, grafana, kafka, linux, portainer, postgresql, prometheus, redis. cat .focus: distributed systems, networking, operating systems, system design, security. systemctl status curiosity: curiosity.service, active (running). uptime: Iran, always curious.">
  <defs><clipPath id="typing"><rect x="100" y="838" width="0" height="28">
    <animate attributeName="width" calcMode="discrete" values="0;12;24;36;48;60;72;84;96;108;120;132;144;156;168;180;192;204;216;228;240;252;264;276;288;300;312;324;336;348;360;372;384;384;384;384;384;384;384;384;384;384;384;384;384;384;384;384;384;384;384;384;360;336;312;288;264;240;216;192;168;144;120;96;72;48;24;0;0;0;0;0;0;0;0;0" dur="8.36s" repeatCount="indefinite"/>
  </rect></clipPath></defs>

  <rect x="0.5" y="0.5" width="1149" height="907" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 48 H1150" stroke="#30363d"/>

  <circle cx="32" cy="24" r="7.5" fill="#ff5f57"/>
  <circle cx="58" cy="24" r="7.5" fill="#febc2e"/>
  <circle cx="84" cy="24" r="7.5" fill="#28c840"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="575" y="30" font-size="15" fill="#8b949e" text-anchor="middle">nima@github: ~ — zsh</text>

    <text y="100"><tspan x="40" fill="#3fb950" font-weight="700">➜</tspan><tspan x="76" fill="#39c5cf">~</tspan><tspan x="100" fill="#c9d1d9">whoami</tspan></text>
    <text x="40" y="138" font-size="24" font-weight="600" fill="#e6edf3">Nima Naghibi</text>
    <text x="40" y="171" font-size="18" fill="#8b949e">Backend &amp; infrastructure engineer @ Hatchup</text>

    <text y="222"><tspan x="40" fill="#3fb950" font-weight="700">➜</tspan><tspan x="76" fill="#39c5cf">~</tspan><tspan x="100" fill="#c9d1d9">cat about.txt</tspan></text>
    <text x="40" y="255" fill="#8b949e">I build the layer underneath — APIs, the servers behind them, and the automation</text>
    <text x="40" y="288" fill="#8b949e">that puts them there. When I want to understand something, I write it from scratch.</text>

    <text y="339"><tspan x="40" fill="#3fb950" font-weight="700">➜</tspan><tspan x="76" fill="#39c5cf">~</tspan><tspan x="100" fill="#c9d1d9">ls langs/</tspan></text>
    <text y="372" fill="#58a6ff"><tspan x="40">bash/</tspan><tspan x="196">c/</tspan><tspan x="352">go/</tspan><tspan x="508">java/</tspan><tspan x="664">python/</tspan><tspan x="820">typescript/</tspan></text>

    <text y="423"><tspan x="40" fill="#3fb950" font-weight="700">➜</tspan><tspan x="76" fill="#39c5cf">~</tspan><tspan x="100" fill="#c9d1d9">ls stack/</tspan></text>
    <text y="456" fill="#58a6ff"><tspan x="40">ansible/</tspan><tspan x="220">docker/</tspan><tspan x="400">docker-swarm/</tspan><tspan x="580">grafana/</tspan><tspan x="760">kafka/</tspan></text>
    <text y="489" fill="#58a6ff"><tspan x="40">linux/</tspan><tspan x="220">portainer/</tspan><tspan x="400">postgresql/</tspan><tspan x="580">prometheus/</tspan><tspan x="760">redis/</tspan></text>

    <text y="540"><tspan x="40" fill="#3fb950" font-weight="700">➜</tspan><tspan x="76" fill="#39c5cf">~</tspan><tspan x="100" fill="#c9d1d9">cat .focus</tspan></text>
    <text x="40" y="573" fill="#8b949e">distributed systems · networking · operating systems · system design · security</text>

    <text y="624"><tspan x="40" fill="#3fb950" font-weight="700">➜</tspan><tspan x="76" fill="#39c5cf">~</tspan><tspan x="100" fill="#c9d1d9">systemctl status curiosity</tspan></text>
    <text y="657"><tspan x="40" fill="#3fb950">●</tspan><tspan x="64" fill="#c9d1d9">curiosity.service</tspan><tspan x="280" fill="#8b949e">- always reading one layer below</tspan></text>
    <text x="100" y="690" fill="#8b949e">Loaded: loaded (/etc/nima/curiosity.service; enabled)</text>
    <text y="723"><tspan x="100" fill="#8b949e">Active:</tspan><tspan x="196" fill="#3fb950" font-weight="600">active (running)</tspan><tspan x="400" fill="#8b949e">since boot</tspan></text>

    <text y="774"><tspan x="40" fill="#3fb950" font-weight="700">➜</tspan><tspan x="76" fill="#39c5cf">~</tspan><tspan x="100" fill="#c9d1d9">uptime</tspan></text>
    <text x="40" y="807" fill="#8b949e">Iran · always curious</text>

    <text y="858"><tspan x="40" fill="#3fb950" font-weight="700">➜</tspan><tspan x="76" fill="#39c5cf">~</tspan></text>
    <text x="100" y="858" fill="#c9d1d9" clip-path="url(#typing)">sudo systemctl restart curiosity</text>
  </g>

  <rect y="843" width="12" height="21" fill="#3fb950" x="100">
    <animate attributeName="x" calcMode="discrete" values="100;112;124;136;148;160;172;184;196;208;220;232;244;256;268;280;292;304;316;328;340;352;364;376;388;400;412;424;436;448;460;472;484;484;484;484;484;484;484;484;484;484;484;484;484;484;484;484;484;484;484;484;460;436;412;388;364;340;316;292;268;244;220;196;172;148;124;100;100;100;100;100;100;100;100;100" dur="8.36s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
